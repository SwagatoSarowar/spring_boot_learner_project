spring:
  config:
    import:
      optional:file:.env[.properties]
  application:
    name: store
  datasource:
    url: jdbc:mysql://localhost:3306/store_api?createDatabaseIfNotExist=true
    username: root
    password: root
  jpa:
    show-sql: true
  jwt:
    secret: ${JWT_SECRET}
    token-expiration: ${JWT_TOKEN_EXPIRATION}